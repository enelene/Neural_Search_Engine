[project]
name = "neural-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.8.0",    # training curves + evaluation plots in the notebooks
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pymupdf>=1.27.2.3",    # PDF text extraction (src/utils.py)
    "rank-bm25>=0.2.2",     # BM25 baseline
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    # --- From-scratch encoder: only torch is needed (NO pretrained-model libs) ---
    "torch>=2.3.0",
    "anthropic>=0.40.0",    # offline LLM query generation for the dataset (notebook 01)
]

[tool.uv]
# "auto" detects the local hardware at sync time:
#   - no GPU (your Windows laptop)  -> installs torch+cpu  (~250 MB)
#   - CUDA GPU (a Linux/Colab box)  -> installs torch+cuXXX (~2.3 GB)
#   - ROCm GPU                       -> installs torch+rocm
# No manual index management needed.
torch-backend = "auto"
