[project]
name = "neural-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gensim>=4.4.0",
    "ipykernel>=7.2.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pymupdf>=1.27.2.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    # --- Bi-Encoder dependencies ---
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "tokenizers>=0.19.0",   # fast tokenizer backend used by transformers
    "safetensors>=0.4.3",   # DistilBERT weights are stored in safetensors format
]

[tool.uv]
# "auto" detects the local hardware at sync time:
#   - no GPU (your Windows laptop)  -> installs torch+cpu  (~250 MB)
#   - CUDA GPU (a Linux/Colab box)  -> installs torch+cuXXX (~2.3 GB)
#   - ROCm GPU                       -> installs torch+rocm
# No manual index management needed.
torch-backend = "auto"
